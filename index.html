<head>
  <meta charset="UTF-8">

  <title>전기실 차단기 위치 검색</title>
  
  <!-- [PWA 설정 및 오프라인 지원 연결] -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  <link rel="apple-touch-icon" href="electric_map.png">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('오프라인 실행 준비 완료!'))
        .catch(err => console.error('서비스워커 등록 실패:', err));
    }
  </script>

  <style>
    body { font-family: 'Malgun Gothic', sans-serif; max-width: 900px; margin: 15px auto; padding: 0 10px; background: #f8f9fa; }
    h2 { text-align: center; color: #1e293b; margin-bottom: 15px; }
    
    .search-wrapper { position: relative; flex: 1; }
    .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
    .search-box input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #007bff; border-radius: 6px; outline: none; box-sizing: border-box; }
    .search-box button { padding: 0 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap; }

    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      max-height: 250px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      display: none;
    }
    .autocomplete-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      font-size: 15px;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background-color: #e0f2fe; color: #0369a1; font-weight: bold; }

    .map-container {
      position: relative;
      display: inline-block;
      width: 100%;
      border: 2px solid #334155;
      border-radius: 6px;
      overflow: hidden;
      background: #e2e8f0;
    }
    .map-container img {
      width: 100%;
      height: auto;
      display: block;
      cursor: crosshair;
    }

    .highlight-box {
      position: absolute;
      border: 3px solid #ef4444;
      background-color: rgba(239, 68, 68, 0.35);
      border-radius: 4px;
      display: none;
      transform: translate(-50%, -50%);
      animation: blink 0.8s infinite alternate;
      pointer-events: none;
    }

    @keyframes blink {
      from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      to { opacity: 0.3; transform: translate(-50%, -50%) scale(1.25); }
    }

    .coord-info { margin-top: 12px; padding: 10px; background: #f1f5f9; border-radius: 6px; font-size: 13px; color: #475569; }
  </style>
</head>

  <div class="search-box">
    <div class="search-wrapper">

      <div id="suggestBox" class="autocomplete-list"></div>
    </div>
    <button onclick="search()">위치 검색</button>
  </div>

    function onTypeInput(text) {
      const suggestBox = document.getElementById('suggestBox');
      const query = text.trim().toUpperCase();
      if (!query) { suggestBox.style.display = 'none'; return; }
      const matches = Object.keys(breakerList).filter(key => key.toUpperCase().includes(query));
      if (matches.length > 0) {
        const uniqueMatches = [...new Set(matches)].slice(0, 15);
        suggestBox.innerHTML = uniqueMatches.map(key => `<div class="autocomplete-item" onclick="selectItem('${key.replace(/'/g, "\\'")}')">${key}</div>`).join('');
        suggestBox.style.display = 'block';
      } else { suggestBox.style.display = 'none'; }
    }

    function selectItem(name) {
      document.getElementById('searchInput').value = name;
      document.getElementById('suggestBox').style.display = 'none';
      locateBreaker(name);
    }

    function search() {
      const input = document.getElementById('searchInput').value.trim().toUpperCase();
      document.getElementById('suggestBox').style.display = 'none';
      if (!input) return;

      // 1. 완전 일치 단어 우선 검색 (예: PLB)
      const exactMatch = Object.keys(breakerList).find(key => key.toUpperCase() === input);
      if (exactMatch) {
        locateBreaker(exactMatch);
        return;
      }

      // 2. 부분 일치 검색 (검색어가 포함된 단어 중 가장 짧은/정확도가 높음 키 선택)
      const partialMatches = Object.keys(breakerList).filter(key => key.toUpperCase().includes(input));
      if (partialMatches.length > 0) {
        partialMatches.sort((a, b) => a.length - b.length);
        locateBreaker(partialMatches[0]);
      } else {
        alert('등록되지 않은 차단기 또는 설비명입니다.');
        document.getElementById('targetBox').style.display = 'none';
      }
    }

    function locateBreaker(name) {
      const target = breakerList[name];
      const box = document.getElementById('targetBox');
      if (target) {
        box.style.left = target.left + '%';
        box.style.top = target.top + '%';
        box.style.width = '45px';
        box.style.height = '45px';
        box.style.display = 'block';
      }
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.search-wrapper')) { document.getElementById('suggestBox').style.display = 'none'; }
    });

    function getCoords(e) {
      const img = document.getElementById('mapImg');
      const rect = img.getBoundingClientRect();
      const left = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
      const top = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
      document.getElementById('clickResult').innerText = `left: ${left}, top: ${top}`;
      const box = document.getElementById('targetBox');
      box.style.left = left + '%'; box.style.top = top + '%'; box.style.width = '45px'; box.style.height = '45px'; box.style.display = 'block';
    }
  </script>

</html>
